# Render Blueprint — key-pool-proxy
# Deploy: connect this repo on Render, or use a Dashboard deeplink from render-deploy.
# Free plan: ephemeral filesystem (no persistent disk). SQLite lives in ./data and
# resets on every redeploy, so DB_PATH keeps the working-dir default.
services:
  - type: web
    name: key-pool-proxy
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: DB_PATH
        value: ./data/kpool.db
      # Point this at your OpenAI-compatible provider, e.g. https://api.example.com/v1
      - key: UPSTREAM_BASE_URL
        value: https://api.openai.com/v1
        sync: false
      # Auth token your apps must send (Bearer). Set to a strong random value.
      - key: GATEWAY_TOKEN
        generateValue: true
        sync: false
      # Auth token guarding the /admin API + UI. Set to a strong random value.
      - key: ADMIN_TOKEN
        generateValue: true
        sync: false
      # Per-key daily token quota (tokens / 24h).
      - key: DEFAULT_KEY_QUOTA
        value: 1000000
        sync: false
      # Optional AES-256-GCM secret to encrypt keys at rest. If unset, keys are
      # stored plaintext (still hashed for lookup). Set once and never change it.
      - key: KEY_ENC_SECRET
        generateValue: true
        sync: false

      # ── GitHub-backed snapshots (survive the ephemeral filesystem) ──
      # On every free-plan redeploy ./data is wiped. These push an encrypted
      # snapshot of the DB to GitHub after writes and restore it on boot when
      # the DB has zero keys. All four are optional; leave them out to skip.
      - key: SNAPSHOT_TOKEN
        value: ""   # GitHub PAT (repo scope, or gist scope with GIST_ID)
        sync: false
      # Where to store it — EITHER "owner/repo" (file data/key-pool.snapshot.json,
      # needs repo scope) OR leave empty and set SNAPSHOT_GIST_ID instead.
      - key: SNAPSHOT_REPO
        value: ""   # e.g. your-name/key-pool-proxy
        sync: false
      # Alternative target: an existing gist id (needs only gist scope).
      - key: SNAPSHOT_GIST_ID
        value: ""
        sync: false
      # AES-256-GCM secret for the snapshot payload. Falls back to KEY_ENC_SECRET.
      - key: SNAPSHOT_SECRET
        generateValue: true
        sync: false
